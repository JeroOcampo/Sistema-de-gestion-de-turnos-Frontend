<app-encabezado-pagina [titulo]="config.titulo" [subtitulo]="config.subtitulo" [icono]="config.icono" />

<div class="barra-acciones">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Buscar</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      #busqueda
      [value]="filtro()"
      (input)="filtro.set(busqueda.value)"
      [placeholder]="'Filtrar ' + config.titulo.toLowerCase()"
    />
  </mat-form-field>
  <span class="espaciador"></span>
  <button mat-flat-button type="button" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon>
    Nueva {{ config.singular }}
  </button>
</div>

<app-alerta-error [mensaje]="errorServidor()" />

@if (cargando()) {
  <app-cargando />
} @else if (filtrados().length === 0) {
  <app-estado-vacio
    [icono]="config.icono"
    [mensaje]="
      filtro() ? 'Ningún registro coincide con la búsqueda.' : 'Todavía no hay registros cargados.'
    "
  />
} @else {
  <div class="tabla-contenedor">
    <table mat-table [dataSource]="filtrados()">
      @for (campo of config.campos; track campo.clave) {
        <ng-container [matColumnDef]="campo.clave">
          <th mat-header-cell *matHeaderCellDef>{{ campo.etiqueta }}</th>
          <td mat-cell *matCellDef="let item">{{ valorCampo(item, campo.clave) }}</td>
        </ng-container>
      }

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="celda-acciones">Acciones</th>
        <td mat-cell *matCellDef="let item" class="celda-acciones">
          <button
            mat-icon-button
            type="button"
            matTooltip="Modificar"
            [attr.aria-label]="'Modificar ' + valorCampo(item, config.campos[0].clave)"
            (click)="abrirFormulario(item)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            matTooltip="Eliminar"
            [attr.aria-label]="'Eliminar ' + valorCampo(item, config.campos[0].clave)"
            (click)="eliminar(item)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
  </div>
}
