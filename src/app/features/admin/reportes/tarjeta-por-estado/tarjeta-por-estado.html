<mat-card appearance="outlined" [style.--mat-card-outlined-container-color]="superficie">
  <mat-card-header>
    <mat-card-title>{{ titulo() }}</mat-card-title>
    <mat-card-subtitle>{{ total() }} turnos en el período</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (total() === 0) {
      <app-estado-vacio icono="bar_chart" mensaje="No hay turnos en el período elegido." />
    } @else {
      <div class="grafico" [style.height.px]="alto()">
        <canvas
          baseChart
          type="bar"
          [data]="datos()"
          [options]="opciones"
          role="img"
          [attr.aria-label]="titulo() + ' por estado. Los valores están en la tabla siguiente.'"
        ></canvas>
      </div>

      <table mat-table [dataSource]="filas()" class="tabla-valores">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>{{ categoria() }}</th>
          <td mat-cell *matCellDef="let fila">{{ fila.nombre }}</td>
        </ng-container>

        @for (estado of estados; track estado.clave) {
          <ng-container [matColumnDef]="estado.clave">
            <th mat-header-cell *matHeaderCellDef class="numero">
              <span class="muestra" [style.background]="estado.color"></span>
              {{ estado.etiqueta }}
            </th>
            <td mat-cell *matCellDef="let fila" class="numero">{{ fila[estado.clave] }}</td>
          </ng-container>
        }

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef class="numero">Total</th>
          <td mat-cell *matCellDef="let fila" class="numero">
            <strong>{{ fila.cantidad_turnos }}</strong>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
