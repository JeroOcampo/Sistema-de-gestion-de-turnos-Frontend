<section class="contenedor-auth">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar>person_add</mat-icon>
      <mat-card-title>Registro de paciente</mat-card-title>
      <mat-card-subtitle>Creá tu cuenta para gestionar tus turnos</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <app-formulario-paciente
        textoBoton="Crear cuenta"
        [enviando]="enviando()"
        [errorServidor]="errorServidor()"
        (enviar)="registrar($event)"
      />
    </mat-card-content>

    <mat-card-actions>
      <span>¿Ya tenés cuenta?</span>
      <a mat-button routerLink="/login">Iniciá sesión</a>
    </mat-card-actions>
  </mat-card>
</section>
