<h2 mat-dialog-title>Turnos confirmados de {{ datos.nombreMedico }}</h2>

<mat-dialog-content>
  <p class="dato-fijo texto-secundario">{{ datos.fecha | date: 'EEEE dd/MM/yyyy' }}</p>

  <app-alerta-error [mensaje]="errorServidor()" />

  @if (cargando()) {
    <app-cargando texto="Cargando turnos…" />
  } @else if (turnos().length === 0) {
    <app-estado-vacio icono="event_available" mensaje="El médico no tiene turnos confirmados ese día." />
  } @else {
    <table mat-table [dataSource]="turnos()">
      <ng-container matColumnDef="hora">
        <th mat-header-cell *matHeaderCellDef>Hora</th>
        <td mat-cell *matCellDef="let turno"><strong>{{ turno.hora }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="paciente">
        <th mat-header-cell *matHeaderCellDef>Paciente</th>
        <td mat-cell *matCellDef="let turno">
          {{ turno.paciente_nombre }}
          <div class="texto-secundario">DNI {{ turno.paciente_dni }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="nota">
        <th mat-header-cell *matHeaderCellDef>Nota</th>
        <td mat-cell *matCellDef="let turno">{{ turno.nota }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="celda-acciones">Acciones</th>
        <td mat-cell *matCellDef="let turno" class="celda-acciones">
          <button mat-stroked-button type="button" (click)="cancelar(turno)">
            <mat-icon>event_busy</mat-icon>
            Cancelar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button type="button" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
