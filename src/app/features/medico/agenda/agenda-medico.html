<app-encabezado-pagina
  titulo="Mi agenda"
  subtitulo="Tus rangos horarios de atención, en todas las sedes donde atendés."
  icono="calendar_month"
/>

<div class="barra-acciones">
  <app-selector-fecha [(fecha)]="fecha" />
  <span class="espaciador"></span>
  <button
    mat-flat-button
    type="button"
    [disabled]="!listoParaCargar()"
    (click)="abrirFormulario()"
  >
    <mat-icon>add</mat-icon>
    Agregar rango horario
  </button>
</div>

<app-alerta-error [mensaje]="errorServidor()" />

@if (cargando()) {
  <app-cargando texto="Cargando tu agenda…" />
} @else if (rangos().length === 0) {
  <app-estado-vacio icono="event_busy" mensaje="No tenés rangos horarios cargados para este día." />
} @else {
  <div class="tabla-contenedor">
    <table mat-table [dataSource]="rangos()">
      <ng-container matColumnDef="horario">
        <th mat-header-cell *matHeaderCellDef>Horario</th>
        <td mat-cell *matCellDef="let rango">{{ rango.hora_entrada }} a {{ rango.hora_salida }}</td>
      </ng-container>

      <ng-container matColumnDef="especialidad">
        <th mat-header-cell *matHeaderCellDef>Especialidad</th>
        <td mat-cell *matCellDef="let rango">{{ rango.especialidad_descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="sede">
        <th mat-header-cell *matHeaderCellDef>Sede</th>
        <td mat-cell *matCellDef="let rango">{{ rango.sede_nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="celda-acciones">Acciones</th>
        <td mat-cell *matCellDef="let rango" class="celda-acciones">
          @if (esPasada()) {
            <span class="texto-secundario">Día pasado</span>
          } @else {
            <button
              mat-icon-button
              type="button"
              matTooltip="Modificar"
              aria-label="Modificar rango horario"
              [disabled]="!listoParaCargar()"
              (click)="abrirFormulario(rango)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              matTooltip="Eliminar"
              aria-label="Eliminar rango horario"
              (click)="eliminar(rango)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
  </div>
}
